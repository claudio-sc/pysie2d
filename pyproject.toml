[project]
name = "pysie2d"
version = "0.4.2"
description = "2-D surface-integral solver for electromagnetic scattering from a cylinder in a homogeneous background."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Claudio Silvestre Castro", email = "claudio.silvestre.castro@gmail.com" },
]
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "matplotlib>=3.9"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "D", "N", "B", "I", "C4", "A"]
ignore = [
    "D203", "D204", "D213", "D215", "D400", "D401",
    "D404", "D406", "D407", "D408", "D409", "D413",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]  # test names are the documentation
# Keep the Bessel/Hankel math notation (J_n, H_n) that maps directly onto the
# cited Bohren & Huffman equations; snake_case would obscure the reference.
"src/pysie2d/reference/mie.py" = ["N806"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
# Without this, __init__.py is not bumped and silently falls behind: it sat at
# 0.2.0 through the v0.2.1, v0.2.2 and v0.3.0 releases because only pyproject
# was listed here.
version_variables = ["src/pysie2d/__init__.py:__version__"]
# No build_command: it runs inside the semantic-release action's own container,
# which has neither uv nor the runner's PATH, so `uv lock` there exits 127 and
# aborts the release. `version_variables = ["uv.lock:version"]` is worse — it
# rewrites *every* `version = "..."` in the lockfile, not just the root package's.
# Stamping uv.lock therefore needs a command proven to run in that container;
# until then the lockfile lags one release and CI installs with --frozen.
commit_parser = "conventional"
commit_parser_options = { ignore_merge_commits = true }
major_on_zero = false
allow_zero_version = true

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.changelog]
exclude_commit_patterns = [
    '''chore(?:\([^)]*?\))?: .+''',
    '''ci(?:\([^)]*?\))?: .+''',
    '''test(?:\([^)]*?\))?: .+''',
    '''Merged? .*''',
]

# `changelog_file` lives here, not on the parent table. PSR 10.6.1 still honours
# the old `changelog.changelog_file` but warns that compatibility breaks in v10,
# and the release path is the worst place to discover a silent config drop: this
# repo already shipped v0.2.2, v0.3.0 and v0.4.0 as tags while PyPI sat at 0.2.1.
# Set explicitly even though "CHANGELOG.md" is the default, so a change of
# default cannot silently retarget the release notes.
[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.remote]
type = "github"
