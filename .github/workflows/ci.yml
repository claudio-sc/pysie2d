name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest
      # The examples generate the figures and back every snippet in the README
      # and the guides in docs/. They import the public API directly, but
      # nothing in pytest touches them, so a rename in the façade would rot the
      # documentation silently. The snippet scripts assert the numbers the
      # guides quote. All of them together run in about a minute.
      - name: Run the examples
        run: |
          for script in examples/*.py; do
            echo "::group::$script"
            uv run python "$script"
            echo "::endgroup::"
          done
